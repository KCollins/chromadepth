<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ChromaDepth 3D Explorer - AGU 2025</title>
    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
          "three/examples/jsm/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
        }
      }
    </script>
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Space+Grotesk:wght@400;500;600&display=swap");

      :root {
        --ink-900: #0b1420;
        --ink-700: #1c2c3a;
        --ink-500: #41586e;
        --sea-500: #0c9fa0;
        --sea-700: #0a6f73;
        --glass: rgba(255, 255, 255, 0.85);
        --stroke: rgba(14, 23, 38, 0.12);
        --radius-lg: 24px;
        --radius-md: 16px;
      }

      body {
        margin: 0;
        font-family: "Space Grotesk", sans-serif;
        background: linear-gradient(130deg, #f7f2e9 0%, #eef2f6 100%);
        min-height: 100vh;
        color: var(--ink-900);
      }

      .page { max-width: 1200px; margin: 0 auto; padding: 40px 20px; }

      header.hero {
        background: white;
        padding: 32px;
        border-radius: var(--radius-lg);
        border: 1px solid var(--stroke);
        box-shadow: 0 20px 40px rgba(0,0,0,0.05);
        margin-bottom: 30px;
      }

      h1 { font-family: "Fraunces", serif; margin: 0 0 10px; font-size: 2.5rem; }

      .upload-area {
        display: flex;
        align-items: center;
        gap: 15px;
        margin-top: 20px;
      }

      .btn-primary {
        position: relative;
        background: var(--ink-900);
        color: white;
        padding: 12px 24px;
        border-radius: 99px;
        font-weight: 600;
        cursor: pointer;
        border: none;
        overflow: hidden;
      }

      .btn-primary input {
        position: absolute;
        top: 0; left: 0; opacity: 0;
        width: 100%; height: 100%;
        cursor: pointer;
      }

      .viewer-grid {
        display: grid;
        grid-template-columns: 280px 1fr;
        gap: 24px;
      }

      .panel {
        background: var(--glass);
        padding: 24px;
        border-radius: var(--radius-lg);
        border: 1px solid var(--stroke);
        backdrop-filter: blur(10px);
      }

      .viewport-container {
        position: relative;
        height: 600px;
        background: #000;
        border-radius: var(--radius-md);
        overflow: hidden;
        border: 1px solid #333;
      }

      canvas { width: 100%; height: 100%; display: block; }

      .controls {
        display: flex;
        gap: 12px;
        margin-bottom: 15px;
        align-items: center;
      }

      .chip {
        background: white;
        padding: 8px 16px;
        border-radius: 99px;
        font-size: 0.9rem;
        border: 1px solid var(--stroke);
      }

      .lib-item {
        width: 100%;
        padding: 12px;
        margin-bottom: 8px;
        border-radius: var(--radius-md);
        border: 1px solid var(--stroke);
        background: white;
        cursor: pointer;
        text-align: left;
        transition: 0.2s;
      }

      .lib-item:hover { border-color: var(--sea-500); background: #f0f9f9; }

      @media (max-width: 900px) { .viewer-grid { grid-template-columns: 1fr; } }
    </style>
  </head>
  <body>
    <div class="page">
      <header class="hero">
        <h1>ChromaDepth™ Visualizer</h1>
        <p>A specialized tool for AGU 2025 to explore 3D data using perceptual depth-to-color mapping.</p>
        <div class="upload-area">
          <div class="btn-primary">
            Upload .GLB / .GLTF
            <input type="file" id="fileInput" accept=".glb,.gltf" />
          </div>
          <span style="font-size: 0.9rem; color: var(--ink-500);">Drag to rotate • Scroll to zoom</span>
        </div>
      </header>

      <div class="viewer-grid">
        <aside class="panel">
          <h3 style="margin-top:0">Sample Library</h3>
          <div id="library">
            <button class="lib-item" data-url="https://threejs.org/examples/models/gltf/DamagedHelmet/glTF/DamagedHelmet.gltf">Damaged Helmet</button>
            <button class="lib-item" data-url="https://threejs.org/examples/models/gltf/LeePerrySmith/LeePerrySmith.glb">Lee Perry Smith</button>
          </div>
        </aside>

        <main class="panel">
          <div class="controls">
            <div class="chip">
              Map: 
              <select id="modeSelect">
                <option value="chroma">ChromaDepth (Custom ACT)</option>
                <option value="original">Original Materials</option>
              </select>
            </div>
            <label class="chip"><input type="checkbox" id="autoRotate" checked> Auto-Rotate</label>
            <button id="resetCam" style="border:none; background:none; cursor:pointer; text-decoration:underline; font-size:0.8rem;">Reset Camera</button>
          </div>

          <div class="viewport-container">
            <canvas id="mainCanvas"></canvas>
            <div style="position:absolute; bottom:15px; left:15px; color:white; font-size:0.7rem; pointer-events:none;">
              NEAR <span style="display:inline-block; width:100px; height:8px; background:linear-gradient(90deg, red, yellow, green, blue); margin: 0 5px; vertical-align:middle; border-radius:4px;"></span> FAR
            </div>
          </div>
        </main>
      </div>
    </div>

    <script type="module">
      import * as THREE from "three";
      import { OrbitControls } from "three/examples/jsm/controls/OrbitControls.js";
      import { GLTFLoader } from "three/examples/jsm/loaders/GLTFLoader.js";

      // --- 1. HEX PALETTE DATA ---
      const chromaHex = "0000 0000 0080 0003 8400 0588 0008 8c00 0b90 000e 9400 1099 0013 9d00 16a1 0019 a500 1ba9 001e ad00 21b1 0024 b500 26b9 0029 bd00 2cc2 002f c600 31ca 0034 ce00 37d2 003a d600 3cda 003f de00 42e2 0045 e600 47eb 004a ef00 4df3 0050 f700 52fb 0055 ff00 59fa 005c f400 60ef 0063 ea00 67e4 006a df00 6eda 0071 d500 75cf 0078 ca00 7cc5 0080 bf00 83ba 0087 b500 8aaf 008e aa00 91a5 0095 9f00 989a 009c 9500 9f8f 00a3 8a00 a685 00aa 8000 ae7a 00b1 7500 b570 00b8 6a00 bc65 00bf 6000 c35a 00c6 5500 ca50 00cd 4a00 d145 00d5 4000 d83a 00dc 3500 df30 00e3 2b00 e625 00ea 2000 ed1b 00f1 1500 f410 00f8 0b00 fb05 00ff 0004 ff00 08ff 000c ff00 10ff 0014 ff00 18ff 001c ff00 20ff 0024 ff00 28ff 002d ff00 31ff 0035 ff00 39ff 003d ff00 41ff 0045 ff00 49ff 004d ff00 51ff 0055 ff00 59ff 005d ff00 61ff 0065 ff00 69ff 006d ff00 71ff 0075 ff00 79ff 007d ff00 82ff 0086 ff00 8aff 008e ff00 92ff 0096 ff00 9aff 009e ff00 a2ff 00a6 ff00 aaff 00ae ff00 b2ff 00b6 ff00 baff 00be ff00 c2ff 00c6 ff00 caff 00ce ff00 d2ff 00d7 ff00 dbff 00df ff00 e3ff 00e7 ff00 ebff 00ef ff00 f3ff 00f7 ff00 fbff 00ff ff00 fffd 00ff fb00 fffa 00ff f800 fff6 00ff f400 fff3 00ff f100 ffef 00ff ed00 ffec 00ff ea00 ffe8 00ff e600 ffe4 00ff e300 ffe1 00ff df00 ffdd 00ff dc00 ffda 00ff d800 ffd6 00ff d500 ffd3 00ff d100 ffcf 00ff cd00 ffcc 00ff ca00 ffc8 00ff c600 ffc5 00ff c300 ffc1 00ff bf00 ffbd 00ff bc00 ffba 00ff b800 ffb6 00ff b500 ffb3 00ff b100 ffaf 00ff ae00 ffac 00ff aa00 f9a4 07f9 a108 f99f 08f9 9c08 f999 08f9 9609 f993 09f9 9009 f88e 09f8 8b0a f888 0af8 850a f882 0af8 800b f87d 0bf8 7a0b fa79 04fa 7604 fa74 04fa 7104 fa6f 04fa 6c04 fa6a 03fa 6703 fa64 03fa 6203 fa5f 03fa 5d03 fa5a 03fa 5803 fa55 03fa 5203 fa50 03fa 4d03 fa4b 02fa 4802 fa46 02fa 4302 fa40 02fa 3e02 fa3b 02fa 3902 fa36 02fa 3302 fa31 02fa 2e02 fa2c 01fa 2901 fa27 01fa 2401 fa21 01fa 1f01 fa1c 01fa 1a01 fa17 01fa 1501 fa12 01fa 0f01 fa0d 00fa 0a00 fa08 00fa 0500 fa03 00fa 0000";

      function buildPalette(hex) {
        const clean = hex.replace(/\s/g, '');
        const data = new Uint8Array(256 * 4); // Use 4 bytes for RGBA
        for (let i = 0; i < 256; i++) {
          const off = i * 6;
          // Reverse during parse: ACT files often start dark, we want Red (Near)
          const targetIdx = 255 - i; 
          data[targetIdx * 4]     = parseInt(clean.substr(off, 2), 16);
          data[targetIdx * 4 + 1] = parseInt(clean.substr(off + 2, 2), 16);
          data[targetIdx * 4 + 2] = parseInt(clean.substr(off + 4, 2), 16);
          data[targetIdx * 4 + 3] = 255; // Alpha
        }
        const tex = new THREE.DataTexture(data, 256, 1, THREE.RGBAFormat);
        tex.needsUpdate = true;
        return tex;
      }

      const paletteTex = buildPalette(chromaHex);

      // --- 2. THE SHADER ---
      const chromaShader = {
        uniforms: {
          uNear: { value: 0 },
          uFar: { value: 10 },
          uPalette: { value: paletteTex }
        },
        vertexShader: `
          varying float vDist;
          void main() {
            vec4 vPos = modelViewMatrix * vec4(position, 1.0);
            vDist = -vPos.z;
            gl_Position = projectionMatrix * vPos;
          }
        `,
        fragmentShader: `
          uniform float uNear;
          uniform float uFar;
          uniform sampler2D uPalette;
          varying float vDist;
          void main() {
            float t = clamp((vDist - uNear) / (uFar - uNear), 0.0, 1.0);
            gl_FragColor = texture2D(uPalette, vec2(t, 0.5));
          }
        `
      };

      const chromaMat = new THREE.ShaderMaterial(chromaShader);

      // --- 3. SCENE LOGIC ---
      let scene, camera, renderer, controls, currentModel;
      const canvas = document.getElementById("mainCanvas");
      const loader = new GLTFLoader();

      function init() {
        scene = new THREE.Scene();
        scene.background = new THREE.Color(0x000000);

        camera = new THREE.PerspectiveCamera(45, canvas.clientWidth / canvas.clientHeight, 0.1, 2000);
        camera.position.set(0, 0, 5);

        renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
        renderer.setPixelRatio(window.devicePixelRatio);
        renderer.setSize(canvas.clientWidth, canvas.clientHeight);

        controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;

        // Listeners
        window.addEventListener('resize', onResize);
        document.getElementById("fileInput").onchange = (e) => {
          const file = e.target.files[0];
          if(file) loadModel(URL.createObjectURL(file));
        };
        document.getElementById("modeSelect").onchange = applyMode;
        document.getElementById("resetCam").onclick = () => controls.reset();
        document.querySelectorAll(".lib-item").forEach(btn => {
          btn.onclick = () => loadModel(btn.dataset.url);
        });

        animate();
        loadModel(document.querySelector(".lib-item").dataset.url);
      }

      function loadModel(url) {
        if(currentModel) scene.remove(currentModel);
        
        loader.load(url, (gltf) => {
          currentModel = gltf.scene;
          
          currentModel.traverse(n => {
            if(n.isMesh) n.userData.origMat = n.material;
          });

          const box = new THREE.Box3().setFromObject(currentModel);
          const center = box.getCenter(new THREE.Vector3());
          currentModel.position.sub(center);
          
          scene.add(currentModel);
          
          // Auto-frame camera
          const size = box.getSize(new THREE.Vector3());
          const maxDim = Math.max(size.x, size.y, size.z);
          camera.position.set(0, 0, maxDim * 1.8);
          controls.target.set(0,0,0);
          controls.saveState();
          
          applyMode();
        });
      }

      function applyMode() {
        if(!currentModel) return;
        const isChroma = document.getElementById("modeSelect").value === "chroma";
        currentModel.traverse(n => {
          if(n.isMesh) n.material = isChroma ? chromaMat : n.userData.origMat;
        });
        scene.background = new THREE.Color(isChroma ? 0x000000 : 0xeef2f6);
        
        // Add lights if original materials are showing
        if(!isChroma && !scene.getObjectByName("mainLight")) {
          const light = new THREE.DirectionalLight(0xffffff, 2);
          light.name = "mainLight";
          light.position.set(1, 1, 2);
          scene.add(light);
          scene.add(new THREE.AmbientLight(0xffffff, 0.5));
        }
      }

      function animate() {
        requestAnimationFrame(animate);
        controls.autoRotate = document.getElementById("autoRotate").checked;
        controls.update();

        if(currentModel && document.getElementById("modeSelect").value === "chroma") {
          const box = new THREE.Box3().setFromObject(currentModel);
          const min = box.min.clone().applyMatrix4(camera.matrixWorldInverse);
          const max = box.max.clone().applyMatrix4(camera.matrixWorldInverse);
          // Calculate camera-relative depth
          chromaShader.uniforms.uNear.value = Math.min(-min.z, -max.z);
          chromaShader.uniforms.uFar.value = Math.max(-min.z, -max.z);
        }

        renderer.render(scene, camera);
      }

      function onResize() {
        camera.aspect = canvas.clientWidth / canvas.clientHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(canvas.clientWidth, canvas.clientHeight);
      }

      init();
    </script>
  </body>
</html>
