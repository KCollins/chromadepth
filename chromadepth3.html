<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>3D ChromaDepth Showcase</title>
    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
          "three/examples/jsm/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
        }
      }
    </script>
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Space+Grotesk:wght@400;500;600&display=swap");

      :root {
        color-scheme: light;
        --ink-900: #0b1420;
        --ink-700: #1c2c3a;
        --ink-600: #2b4256;
        --ink-500: #41586e;
        --sand-50: #f7f2e9;
        --sand-100: #efe6d8;
        --sea-500: #0c9fa0;
        --sea-700: #0a6f73;
        --sun-500: #f59f0b;
        --glass: rgba(255, 255, 255, 0.82);
        --glass-strong: rgba(255, 255, 255, 0.92);
        --stroke: rgba(14, 23, 38, 0.12);
        --shadow: 0 22px 50px rgba(11, 20, 32, 0.16);
        --shadow-soft: 0 14px 30px rgba(11, 20, 32, 0.12);
        --radius-lg: 24px;
        --radius-md: 16px;
        --radius-sm: 12px;
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        min-height: 100vh;
        font-family: "Space Grotesk", "Segoe UI", sans-serif;
        color: var(--ink-900);
        background:
          radial-gradient(1200px 600px at 15% -10%, rgba(12, 159, 160, 0.2), transparent 60%),
          radial-gradient(900px 500px at 90% 0%, rgba(245, 159, 11, 0.18), transparent 55%),
          linear-gradient(130deg, #f7f2e9 0%, #eef2f6 58%, #eef2eb 100%);
      }

      .page { max-width: 1200px; margin: 0 auto; padding: 32px 20px 60px; }

      .hero {
        display: grid; gap: 18px; padding: 32px;
        background: var(--glass-strong); border-radius: var(--radius-lg);
        box-shadow: var(--shadow); border: 1px solid var(--stroke);
      }

      .hero h1 { font-family: "Fraunces", serif; font-size: clamp(2.2rem, 3vw, 3.3rem); margin: 0; }
      .hero-actions { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; }

      /* Upload Button Style */
      .upload-container {
        position: relative;
        overflow: hidden;
        display: inline-block;
      }
      .upload-container input[type=file] {
        position: absolute; left: 0; top: 0; opacity: 0; cursor: pointer; width: 100%; height: 100%;
      }

      .primary-button { padding: 12px 24px; border-radius: 999px; background: var(--ink-900); color: #fff; font-weight: 600; border: none; cursor: pointer; transition: 0.2s; }
      .primary-button:hover { transform: translateY(-1px); background: var(--sea-700); }
      .secondary-button { padding: 12px 24px; border-radius: 999px; background: #fff; color: var(--ink-900); font-weight: 600; border: 1px solid var(--stroke); cursor: pointer; }

      .viewer-section { display: grid; grid-template-columns: 300px 1fr; gap: 24px; margin-top: 28px; }
      .panel { background: var(--glass); border-radius: var(--radius-lg); padding: 22px; border: 1px solid var(--stroke); box-shadow: var(--shadow-soft); }

      .model-list { display: grid; gap: 10px; margin-top: 10px; }
      .model-button { padding: 12px; border-radius: var(--radius-md); border: 1px solid var(--stroke); background: white; text-align: left; cursor: pointer; }
      .model-button.active { border-color: var(--sea-500); background: rgba(12, 159, 160, 0.05); }

      .viewer-stage { position: relative; border-radius: var(--radius-lg); overflow: hidden; height: 500px; background: #000; border: 1px solid var(--stroke); }
      #modelCanvas { width: 100%; height: 100%; }

      .controls-bar { display: flex; gap: 12px; margin-bottom: 16px; align-items: center; flex-wrap: wrap; }
      .chip { background: #fff; padding: 6px 12px; border-radius: 999px; border: 1px solid var(--stroke); font-size: 0.9rem; }

      @media (max-width: 900px) { .viewer-section { grid-template-columns: 1fr; } }
    </style>
  </head>
  <body>
    <div class="page">
      <header class="hero">
        <h1>ChromaDepth 3D Explorer</h1>
        <p>Upload a GLB/GLTF model to view it with depth-encoded color mapping. Perfect for 3D glasses.</p>
        <div class="hero-actions">
          <div class="upload-container">
            <button class="primary-button">Upload .GLB / .GLTF</button>
            <input type="file" id="fileUpload" accept=".glb,.gltf" />
          </div>
          <span class="hero-hint">Or select a sample from the library below.</span>
        </div>
      </header>

      <section class="viewer-section">
        <aside class="panel">
          <h3>Assets Library</h3>
          <div class="model-list" id="modelList"></div>
        </aside>

        <div class="panel">
          <div class="controls-bar">
            <div class="chip">
              Mode: 
              <select id="colormapSelect">
                <option value="chromadepth">ChromaDepth</option>
                <option value="original">Original Material</option>
              </select>
            </div>
            <label class="chip"><input type="checkbox" id="autoRotate" checked> Auto-Rotate</label>
            <button class="secondary-button" id="resetView" style="padding: 6px 14px;">Reset Camera</button>
          </div>

          <div class="viewer-stage">
            <canvas id="modelCanvas"></canvas>
            <div style="position: absolute; bottom: 10px; right: 10px; color: white; font-size: 0.7rem; opacity: 0.5;">
              RED = NEAR | BLUE = FAR
            </div>
          </div>
          
          <div id="modelInfo" style="margin-top: 15px;">
            <h2 id="modelTitle" style="margin: 0;">Select a model</h2>
            <p id="modelSubtitle" style="color: var(--ink-500);">Ready to visualize data.</p>
          </div>
        </div>
      </section>
    </div>

<script type="module">
  import * as THREE from "three";
  import { OrbitControls } from "three/examples/jsm/controls/OrbitControls.js";
  import { GLTFLoader } from "three/examples/jsm/loaders/GLTFLoader.js";

  // --- 1. PARSE THE CUSTOM PALETTE ---
  const rawHex = `0000 0000 0080 0003 8400 0588 0008 8c00 0b90 000e 9400 1099 0013 9d00 16a1 0019 a500 1ba9 001e ad00 21b1 0024 b500 26b9 0029 bd00 2cc2 002f c600 31ca 0034 ce00 37d2 003a d600 3cda 003f de00 42e2 0045 e600 47eb 004a ef00 4df3 0050 f700 52fb 0055 ff00 59fa 005c f400 60ef 0063 ea00 67e4 006a df00 6eda 0071 d500 75cf 0078 ca00 7cc5 0080 bf00 83ba 0087 b500 8aaf 008e aa00 91a5 0095 9f00 989a 009c 9500 9f8f 00a3 8a00 a685 00aa 8000 ae7a 00b1 7500 b570 00b8 6a00 bc65 00bf 6000 c35a 00c6 5500 ca50 00cd 4a00 d145 00d5 4000 d83a 00dc 3500 df30 00e3 2b00 e625 00ea 2000 ed1b 00f1 1500 f410 00f8 0b00 fb05 00ff 0004 ff00 08ff 000c ff00 10ff 0014 ff00 18ff 001c ff00 20ff 0024 ff00 28ff 002d ff00 31ff 0035 ff00 39ff 003d ff00 41ff 0045 ff00 49ff 004d ff00 51ff 0055 ff00 59ff 005d ff00 61ff 0065 ff00 69ff 006d ff00 71ff 0075 ff00 79ff 007d ff00 82ff 0086 ff00 8aff 008e ff00 92ff 0096 ff00 9aff 009e ff00 a2ff 00a6 ff00 aaff 00ae ff00 b2ff 00b6 ff00 baff 00be ff00 c2ff 00c6 ff00 caff 00ce ff00 d2ff 00d7 ff00 dbff 00df ff00 e3ff 00e7 ff00 ebff 00ef ff00 f3ff 00f7 ff00 fbff 00ff ff00 fffd 00ff fb00 fffa 00ff f800 fff6 00ff f400 fff3 00ff f100 ffef 00ff ed00 ffec 00ff ea00 ffe8 00ff e600 ffe4 00ff e300 ffe1 00ff df00 ffdd 00ff dc00 ffda 00ff d800 ffd6 00ff d500 ffd3 00ff d100 ffcf 00ff cd00 ffcc 00ff ca00 ffc8 00ff c600 ffc5 00ff c300 ffc1 00ff bf00 ffbd 00ff bc00 ffba 00ff b800 ffb6 00ff b500 ffb3 00ff b100 ffaf 00ff ae00 ffac 00ff aa00 f9a4 07f9 a108 f99f 08f9 9c08 f999 08f9 9609 f993 09f9 9009 f88e 09f8 8b0a f888 0af8 850a f882 0af8 800b f87d 0bf8 7a0b fa79 04fa 7604 fa74 04fa 7104 fa6f 04fa 6c04 fa6a 03fa 6703 fa64 03fa 6203 fa5f 03fa 5d03 fa5a 03fa 5803 fa55 03fa 5203 fa50 03fa 4d03 fa4b 02fa 4802 fa46 02fa 4302 fa40 02fa 3e02 fa3b 02fa 3902 fa36 02fa 3302 fa31 02fa 2e02 fa2c 01fa 2901 fa27 01fa 2401 fa21 01fa 1f01 fa1c 01fa 1a01 fa17 01fa 1501 fa12 01fa 0f01 fa0d 00fa 0a00 fa08 00fa 0500 fa03 00fa 0000`;

  function createPaletteTexture(hexString) {
    const cleanHex = hexString.replace(/\s/g, '');
    const data = new Uint8Array(256 * 3);
    for (let i = 0; i < 256; i++) {
      // Read RGB from hex (each color is 6 chars)
      const offset = i * 6;
      data[i * 3]     = parseInt(cleanHex.substring(offset, offset + 2), 16);
      data[i * 3 + 1] = parseInt(cleanHex.substring(offset + 2, offset + 4), 16);
      data[i * 3 + 2] = parseInt(cleanHex.substring(offset + 4, offset + 6), 16);
    }
    // Reverse the array so Red (end of ACT) becomes index 0 (Near)
    const reversedData = new Uint8Array(data.length);
    for(let i=0; i<256; i++) {
      reversedData[i*3] = data[(255-i)*3];
      reversedData[i*3+1] = data[(255-i)*3+1];
      reversedData[i*3+2] = data[(255-i)*3+2];
    }
    const tex = new THREE.DataTexture(reversedData, 256, 1, THREE.RGBFormat);
    tex.needsUpdate = true;
    return tex;
  }

  const paletteTexture = createPaletteTexture(rawHex);

  // --- 2. UPDATED SHADER ---
  const chromaDepthShader = {
    uniforms: {
      uNear: { value: 0 },
      uFar: { value: 10 },
      uPalette: { value: paletteTexture }
    },
    vertexShader: `
      varying float vDepth;
      void main() {
        vec4 viewPos = modelViewMatrix * vec4(position, 1.0);
        vDepth = -viewPos.z;
        gl_Position = projectionMatrix * viewPos;
      }
    `,
    fragmentShader: `
      uniform float uNear;
      uniform float uFar;
      uniform sampler2D uPalette;
      varying float vDepth;
      void main() {
        float t = clamp((vDepth - uNear) / (uFar - uNear), 0.0, 1.0);
        // Sample the palette texture. 0.5 is the middle of our 1px high texture.
        vec3 color = texture2D(uPalette, vec2(t, 0.5)).rgb;
        gl_FragColor = vec4(color, 1.0);
      }
    `
  };

  const chromaMaterial = new THREE.ShaderMaterial(chromaDepthShader);

  // --- 3. REST OF THE LOGIC ---
  let scene, camera, renderer, controls, currentModel;
  const canvas = document.getElementById("modelCanvas");
  const loader = new GLTFLoader();

  function init() {
    scene = new THREE.Scene();
    scene.background = new THREE.Color(0x000000);
    camera = new THREE.PerspectiveCamera(45, canvas.clientWidth / canvas.clientHeight, 0.1, 1000);
    renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
    renderer.setPixelRatio(window.devicePixelRatio);
    renderer.setSize(canvas.clientWidth, canvas.clientHeight);
    controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;

    window.addEventListener('resize', onResize);
    document.getElementById("fileUpload").addEventListener("change", handleFileUpload);
    document.getElementById("colormapSelect").onchange = applyColormap;
    document.getElementById("resetView").onclick = () => controls.reset();

    animate();
  }

  function handleFileUpload(event) {
    const file = event.target.files[0];
    if (file) loadModel(URL.createObjectURL(file), file.name);
  }

  function loadModel(url, name) {
    if (currentModel) scene.remove(currentModel);
    document.getElementById("modelTitle").innerText = "Loading...";
    loader.load(url, (gltf) => {
      currentModel = gltf.scene;
      currentModel.traverse(node => { 
        if (node.isMesh) node.userData.originalMaterial = node.material; 
      });
      const box = new THREE.Box3().setFromObject(currentModel);
      const center = box.getCenter(new THREE.Vector3());
      currentModel.position.sub(center);
      scene.add(currentModel);
      document.getElementById("modelTitle").innerText = name;
      
      const size = box.getSize(new THREE.Vector3());
      camera.position.set(0, 0, Math.max(size.x, size.y, size.z) * 2);
      controls.target.set(0,0,0);
      applyColormap();
    });
  }

  function applyColormap() {
    if (!currentModel) return;
    const isChroma = document.getElementById("colormapSelect").value === "chromadepth";
    currentModel.traverse(node => {
      if (node.isMesh) node.material = isChroma ? chromaMaterial : node.userData.originalMaterial;
    });
    scene.background = new THREE.Color(isChroma ? 0x000000 : 0xf7f2e9);
  }

  function animate() {
    requestAnimationFrame(animate);
    if (currentModel && document.getElementById("colormapSelect").value === "chromadepth") {
      const box = new THREE.Box3().setFromObject(currentModel);
      const min = box.min.clone().applyMatrix4(camera.matrixWorldInverse);
      const max = box.max.clone().applyMatrix4(camera.matrixWorldInverse);
      chromaDepthShader.uniforms.uNear.value = Math.min(-min.z, -max.z);
      chromaDepthShader.uniforms.uFar.value = Math.max(-min.z, -max.z);
    }
    controls.autoRotate = document.getElementById("autoRotate").checked;
    controls.update();
    renderer.render(scene, camera);
  }

  function onResize() {
    camera.aspect = canvas.clientWidth / canvas.clientHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(canvas.clientWidth, canvas.clientHeight);
  }

  init();
</script>
  </body>
</html>
